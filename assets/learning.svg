
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" />
      <stop offset="100%" />
    </linearGradient>

    <linearGradient id="accent">
      <stop offset="0%">
        <animate
          attributeName="stop-color"
          values="#6f42c1;#00d9ff;#6f42c1"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%">
        <animate
          attributeName="stop-color"
          values="#00d9ff;#6f42c1;#00d9ff"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->

  <rect
    width="1000"
    height="260"
    rx="25"
    fill="url(#bg)"
    stroke="#333"
    stroke-width="2"/>


  <!-- Heading -->

  <text
    x="500"
    y="45"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="url(#accent)">

    CURRENTLY LEARNING

  </text>


  <!-- Learning nodes -->

  <g
    stroke="url(#accent)"
    stroke-width="2"
    fill="none">

    <line x1="500" y1="130" x2="250" y2="90"/>
    <line x1="500" y1="130" x2="750" y2="90"/>

    <line x1="500" y1="130" x2="250" y2="180"/>
    <line x1="500" y1="130" x2="750" y2="180"/>

  </g>


  <!-- Central AI node -->

  <circle
    cx="500"
    cy="130"
    r="42"
    fill="none"
    stroke="url(#accent)"
    stroke-width="3"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="38;46;38"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="500"
    y="138"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="bold"
    fill="white">

    AI

  </text>


  <!-- Learning labels -->

  <g
    font-family="Arial, sans-serif"
    font-size="17"
    font-weight="bold"
    fill="white"
    text-anchor="middle">

    <text x="250" y="82">
      MACHINE LEARNING
    </text>

    <text x="750" y="82">
      DEEP LEARNING
    </text>

    <text x="250" y="190">
      GENERATIVE AI
    </text>

    <text x="750" y="190">
      TRANSFORMERS
    </text>

  </g>


  <!-- Animated dots -->

  <g fill="#00d9ff" filter="url(#glow)">

    <circle cx="250" cy="90" r="6">
      <animate
        attributeName="r"
        values="4;9;4"
        dur="1.8s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="90" r="6">
      <animate
        attributeName="r"
        values="9;4;9"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="180" r="6">
      <animate
        attributeName="r"
        values="4;9;4"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="180" r="6">
      <animate
        attributeName="r"
        values="9;4;9"
        dur="1.7s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- Bottom progress animation -->

  <rect
    x="300"
    y="225"
    width="400"
    height="3"
    rx="2"
    fill="#333"/>

  <rect
    x="300"
    y="225"
    width="80"
    height="3"
    rx="2"
    fill="#00d9ff">

    <animate
      attributeName="width"
      values="80;400;80"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

</svg>
